<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目导航 | UI Components</title>
    <!-- Tailwind CSS 4 -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Inter:wght@400;500;600&display=swap');

        :root {
            --bg-color: #f4f1ea;
            --paper-texture: url('https://www.transparenttextures.com/patterns/natural-paper.png');
        }

        body {
            background-color: var(--bg-color);
            background-image: var(--paper-texture);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: #2c2c2c;
            min-height: 100vh;
        }

        .title-font {
            font-family: 'Noto+Serif+SC', serif;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }

        .folder-section {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .folder-section:hover {
            transform: translateY(-2px);
            border-color: rgba(0, 0, 0, 0.1);
        }

        [v-cloak] {
            display: none;
        }
    </style>
</head>

<body class="p-8 md:p-16">
    <div id="app" v-cloak class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="mb-16 border-b border-black/5 pb-8">
            <h1 class="text-4xl md:text-5xl font-bold title-font text-stone-800 mb-4">项目导航</h1>
            <p class="text-stone-500 max-w-2xl leading-relaxed">
                当前项目目录下的所有 HTML 页面。点击下方卡片在新标签页中预览对应组件。
            </p>
        </header>

        <!-- Dynamic Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <template v-for="(folder, folderName) in tree" :key="folderName">
                <div class="folder-section glass-card rounded-2xl p-6 flex flex-col">
                    <div class="flex items-center gap-3 mb-6">
                        <div
                            class="w-10 h-10 rounded-xl bg-stone-800 flex items-center justify-center text-white shadow-lg">
                            <i class="ph-bold ph-folder-open text-xl"></i>
                        </div>
                        <div>
                            <h2 class="text-lg font-bold text-stone-800">{{ folderName }}</h2>
                            <p class="text-xs text-stone-400 uppercase tracking-widest">{{ folder.files.length }} 个项目
                            </p>
                        </div>
                    </div>

                    <!-- File List -->
                    <div class="space-y-3 flex-grow">
                        <!-- Nested Subfolders if any -->
                        <div v-for="(sub, subName) in folder.subfolders" :key="subName" class="mb-6 last:mb-0">
                            <h3
                                class="text-xs font-semibold text-stone-400 mb-3 px-1 border-l-2 border-stone-200 ml-1 pl-2">
                                {{ subName }}
                            </h3>
                            <div class="space-y-2">
                                <a v-for="file in sub.files" :key="file.path" :href="file.path" target="_blank"
                                    class="group flex items-center justify-between p-3 rounded-xl hover:bg-white/60 transition-all border border-transparent hover:border-black/5">
                                    <div class="flex items-center gap-3 overflow-hidden">
                                        <i
                                            class="ph-bold ph-file-html text-stone-400 group-hover:text-stone-800 transition-colors"></i>
                                        <span
                                            class="text-sm font-medium text-stone-600 group-hover:text-stone-900 truncate">
                                            {{ file.displayName }}
                                        </span>
                                    </div>
                                    <i
                                        class="ph-bold ph-arrow-up-right text-stone-300 group-hover:text-stone-800 text-xs transition-all opacity-0 group-hover:opacity-100 transform translate-y-1 group-hover:translate-y-0"></i>
                                </a>
                            </div>
                        </div>

                        <!-- Direct Files -->
                        <div class="space-y-2">
                            <a v-for="file in folder.files" :key="file.path" :href="file.path" target="_blank"
                                class="group flex items-center justify-between p-3 rounded-xl hover:bg-white/60 transition-all border border-transparent hover:border-black/5">
                                <div class="flex items-center gap-3 overflow-hidden">
                                    <i
                                        class="ph-bold ph-file-html text-stone-400 group-hover:text-stone-800 transition-colors"></i>
                                    <span
                                        class="text-sm font-medium text-stone-600 group-hover:text-stone-900 truncate">
                                        {{ file.displayName }}
                                    </span>
                                </div>
                                <i
                                    class="ph-bold ph-arrow-up-right text-stone-300 group-hover:text-stone-800 text-xs transition-all opacity-0 group-hover:opacity-100 transform translate-y-1 group-hover:translate-y-0"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </template>
        </div>

        <!-- Footer -->
        <footer class="mt-24 pt-8 border-t border-black/5 flex flex-col md:flex-row justify-between items-center gap-4">
            <p class="text-stone-400 text-sm">
                &copy; {{ new Date().getFullYear() }} UI Design System. 所有页面均已就绪。
            </p>
            <p class="text-stone-300 text-xs font-mono">
                LAST UPDATED: 2026-01-06
            </p>
        </footer>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                // 该数据由 Antigravity AI 扫描生成
                // 模拟自动扫描：在静态环境下，我们预置目录结构
                const rawFiles = [
                    "电脑端/1.html",
                    "电脑端/2.html",
                    "电脑端/3.html",
                    "电脑端/BiliBiliNoteBook.html",
                    "移动端/AI对话/chatgpt.html",
                    "移动端/AI对话/claude.html",
                    "移动端/AI对话/deepseek.html",
                    "移动端/AI对话/doubao.html",
                    "移动端/AI对话/gemini.html",
                    "移动端/AI对话/index.html",
                    "移动端/AI对话/zhipu.html",
                    "移动端/中医诊疗/index.html",
                    "移动端/中医诊疗/test/test.html",
                    "移动端/中医诊疗/test/test1.html",
                    "移动端/中医诊疗/test/1111/1111.html"
                ];

                const tree = ref({});

                const buildTree = () => {
                    const result = {};
                    rawFiles.forEach(path => {
                        const parts = path.split('/');
                        const fileName = parts.pop();
                        const folder = parts[0] || '根目录';
                        const subfolder = parts[1];

                        if (!result[folder]) {
                            result[folder] = { files: [], subfolders: {} };
                        }

                        const folderObj = result[folder];
                        let displayName = fileName.replace('.html', '');
                        if (displayName.toLowerCase() === 'index') {
                            displayName = (subfolder || folder) + ' 主页';
                        }

                        if (subfolder) {
                            if (!folderObj.subfolders[subfolder]) {
                                folderObj.subfolders[subfolder] = { files: [] };
                            }
                            folderObj.subfolders[subfolder].files.push({ path, displayName });
                        } else {
                            folderObj.files.push({ path, displayName });
                        }
                    });
                    tree.value = result;
                };

                onMounted(() => {
                    buildTree();
                });

                return {
                    tree
                };
            }
        }).mount('#app');
    </script>
</body>

</html>
