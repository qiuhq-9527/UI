<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>悬壶智诊 - 现代中医智能终端</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Noto Serif SC"', 'serif'],
                    },
                    colors: {
                        tcm: {
                            base: '#f4f1ea', // 宣纸色系
                            ink: '#2c3e50',
                            teal: '#2d5a57', // 沉稳黛绿
                            vermilion: '#a5433d', // 官窑红
                            ochre: '#c49a6c'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f4f1ea;
            background-image:
                radial-gradient(at 0% 0%, hsla(180, 15%, 85%, 1) 0, transparent 50%),
                radial-gradient(at 50% 0%, hsla(45, 20%, 90%, 1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(10, 20%, 88%, 1) 0, transparent 50%);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        ::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        /* 油画感玻璃 - Apple 风格的高级透明感 */
        .oil-glass {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(25px) saturate(160%);
            -webkit-backdrop-filter: blur(25px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: inset 0 0 1px 1px rgba(255, 255, 255, 0.2);
        }

        .paint-texture::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            opacity: 0.03;
            pointer-events: none;
            z-index: 100;
        }

        .accent-dot {
            width: 4px;
            height: 4px;
            background-color: #a5433d;
            border-radius: 50%;
        }

        /* 苹果风格的软阴影与层级 */
        .apple-shadow {
            box-shadow: 0 10px 30px -10px rgba(44, 62, 80, 0.08);
        }

        /* 触感反馈 */
        .tactile:active {
            opacity: 0.8;
            transform: scale(0.98);
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* 艺术化背景 Icon */
        .hero-bg-icon {
            position: absolute;
            right: -20px;
            bottom: -30px;
            opacity: 0.04;
            transform: rotate(-15deg);
            pointer-events: none;
        }
    </style>
</head>

<body class="font-sans text-tcm-ink paint-texture">

    <div class="max-w-md mx-auto h-screen flex flex-col relative no-scrollbar">

        <!-- Header -->
        <header class="pt-16 px-8 pb-4 flex flex-col">
            <div class="flex items-center gap-2 mb-1">
                <span class="accent-dot"></span>
                <span class="text-[10px] font-bold tracking-[0.2em] text-tcm-ink/30 uppercase font-mono">Bio-Harmonic
                    AI</span>
            </div>
            <h1 class="text-3xl font-serif font-black tracking-tight text-tcm-ink">
                悬壶<span class="text-tcm-vermilion mx-px opacity-80">·</span><span
                    class="font-light opacity-30">智诊</span>
            </h1>
        </header>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto px-6 pb-40 no-scrollbar">

            <!-- Hero Service: Diagnosis -->
            <section class="mt-4 mb-10">
                <div class="oil-glass rounded-[28px] p-8 relative overflow-hidden tactile apple-shadow">
                    <!-- Borrowed Background Icon Style -->
                    <div class="hero-bg-icon">
                        <i data-lucide="fingerprint" class="w-64 h-64"></i>
                    </div>

                    <!-- Atmospheric Glows -->
                    <div class="absolute -top-10 -left-10 w-40 h-40 bg-tcm-teal/5 blur-[50px]"></div>

                    <div class="relative z-10 flex flex-col">
                        <div class="mb-8">
                            <span
                                class="text-[10px] font-bold text-tcm-teal tracking-widest uppercase bg-tcm-teal/5 px-2 py-0.5 rounded">Primary
                                System</span>
                        </div>

                        <h2 class="text-3xl font-serif font-bold mb-4 leading-[1.2] text-tcm-ink/90">
                            开启<br />完整辩证诊断
                        </h2>
                        <p class="text-tcm-ink/40 text-[11px] leading-relaxed max-w-[190px] mb-8">
                            深度融合中医经典与现代算力，构建您的动态经络数字孪生。
                        </p>

                        <div>
                            <button
                                class="bg-tcm-teal text-white w-14 h-14 rounded-2xl flex items-center justify-center shadow-xl shadow-tcm-teal/20 transition-transform">
                                <i data-lucide="activity" class="w-6 h-6"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Specialized Collection: Redesigned Artistic Cards -->
            <section class="mb-10">
                <div class="flex items-end justify-between mb-8 px-1">
                    <div>
                        <h3 class="font-serif text-lg font-bold text-tcm-ink/80">四诊数据采集</h3>
                        <p class="text-[10px] text-tcm-ink/30 font-mono tracking-wider">SPECIALIZED DATA NODES</p>
                    </div>
                    <div class="h-[1px] flex-1 bg-gradient-to-r from-tcm-ink/10 to-transparent ml-4 mb-2"></div>
                </div>

                <!-- Asymmetric Bento Grid (Apple & Artistic Style) -->
                <div class="grid grid-cols-2 grid-rows-2 gap-3 h-[380px]">
                    <!-- Visual Node: Tall & Featured -->
                    <div
                        class="oil-glass rounded-[24px] row-span-2 p-6 tactile apple-shadow relative overflow-hidden flex flex-col justify-between">
                        <div
                            class="absolute -right-4 top-10 opacity-[0.03] text-7xl font-serif font-black select-none pointer-events-none">
                            望</div>
                        <div
                            class="w-10 h-10 rounded-xl bg-tcm-teal/5 text-tcm-teal flex items-center justify-center relative z-10">
                            <i data-lucide="eye" class="w-5 h-5"></i>
                        </div>
                        <div class="relative z-10">
                            <h4 class="text-sm font-bold text-tcm-ink/80 leading-tight">形态望诊</h4>
                            <p class="text-[9px] text-tcm-ink/30 uppercase mt-1 font-mono">Vision Essence</p>
                        </div>
                        <div class="h-1 bg-gradient-to-r from-tcm-teal/20 to-transparent rounded-full w-12"></div>
                    </div>

                    <!-- Audio Node: Minimalist Square -->
                    <div
                        class="oil-glass rounded-[24px] p-5 tactile apple-shadow relative overflow-hidden flex flex-col justify-between">
                        <div
                            class="absolute right-2 bottom-2 opacity-[0.03] text-5xl font-serif font-black select-none pointer-events-none">
                            闻</div>
                        <div class="flex justify-between items-start relative z-10">
                            <div
                                class="w-8 h-8 rounded-lg bg-tcm-vermilion/5 text-tcm-vermilion/60 flex items-center justify-center">
                                <i data-lucide="ear" class="w-4 h-4"></i>
                            </div>
                            <i data-lucide="plus" class="w-3 h-3 text-tcm-ink/10"></i>
                        </div>
                        <div class="relative z-10">
                            <h4 class="text-xs font-bold text-tcm-ink/80">气息闻诊</h4>
                            <p class="text-[8px] text-tcm-ink/20 uppercase font-mono tracking-tighter">Audio Sense</p>
                        </div>
                    </div>

                    <!-- Query Node: Minimalist Square -->
                    <div
                        class="oil-glass rounded-[24px] p-5 tactile apple-shadow relative overflow-hidden flex flex-col justify-between">
                        <div
                            class="absolute right-2 bottom-2 opacity-[0.03] text-5xl font-serif font-black select-none pointer-events-none">
                            问</div>
                        <div class="flex justify-between items-start relative z-10">
                            <div
                                class="w-8 h-8 rounded-lg bg-tcm-ochre/5 text-tcm-ochre flex items-center justify-center">
                                <i data-lucide="message-square-quote" class="w-4 h-4"></i>
                            </div>
                            <i data-lucide="plus" class="w-3 h-3 text-tcm-ink/10"></i>
                        </div>
                        <div class="relative z-10">
                            <h4 class="text-xs font-bold text-tcm-ink/80">深度问诊</h4>
                            <p class="text-[8px] text-tcm-ink/20 uppercase font-mono tracking-tighter">Dialectic</p>
                        </div>
                    </div>
                </div>

                <!-- Pulse Node: Wide Bridge (Separated for Rhythm) -->
                <div class="mt-3">
                    <div
                        class="oil-glass rounded-[24px] p-5 tactile apple-shadow relative overflow-hidden flex items-center justify-between">
                        <div
                            class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 opacity-[0.02] text-8xl font-serif font-black select-none pointer-events-none">
                            切</div>
                        <div class="flex items-center gap-4 relative z-10">
                            <div
                                class="w-12 h-12 rounded-2xl bg-tcm-ink/5 text-tcm-ink/40 flex items-center justify-center">
                                <i data-lucide="fingerprint" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <h4 class="text-sm font-bold text-tcm-ink/80">指感切诊</h4>
                                <p class="text-[9px] text-tcm-ink/30 uppercase font-mono tracking-widest">Digital
                                    Palpation</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 relative z-10">
                            <div class="flex gap-0.5">
                                <div class="w-1 h-3 bg-tcm-ink/10 rounded-full"></div>
                                <div class="w-1 h-5 bg-tcm-ink/20 rounded-full"></div>
                                <div class="w-1 h-2 bg-tcm-ink/10 rounded-full"></div>
                            </div>
                            <i data-lucide="chevron-right" class="w-4 h-4 text-tcm-ink/20"></i>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Featured: Smart Prescription  -->
            <section class="mt-14">
                <div class="oil-glass rounded-[24px] p-2 tactile apple-shadow group">
                    <div class="bg-white/30 rounded-[20px] p-6 flex items-center gap-5">
                        <div
                            class="w-14 h-14 rounded-2xl bg-gradient-to-br from-tcm-ink to-slate-600 flex items-center justify-center shadow-lg group-hover:rotate-3 transition-transform">
                            <i data-lucide="scroll-text" class="w-6 h-6 text-white/90"></i>
                        </div>
                        <div class="flex-1">
                            <h4 class="font-serif font-bold text-base text-tcm-ink/80">智能开方</h4>
                            <p class="text-[10px] text-tcm-ink/30 font-mono tracking-tight uppercase">AI Prescription
                                System</p>
                        </div>
                        <i data-lucide="chevron-right" class="w-5 h-5 text-tcm-ink/10"></i>
                    </div>
                </div>
            </section>

        </main>

        <!-- Dock: Mandatory Unchanged -->
        <div class="fixed bottom-0 left-0 w-full px-6 pb-6 pointer-events-none">
            <nav
                class="bg-[#fcfaf5]/90 backdrop-blur-xl rounded-2xl px-10 py-4 flex justify-between items-center shadow-lg shadow-tcm-ink/5 pointer-events-auto border border-white/80">
                <a href="#" class="flex flex-col items-center gap-1 text-tcm-teal">
                    <i data-lucide="house" class="w-5 h-5"></i>
                    <span class="text-[8px] font-bold tracking-[0.1em]">首页</span>
                </a>
                <a href="#" class="flex flex-col items-center gap-1 text-tcm-ink/30 active:text-tcm-ink/60">
                    <i data-lucide="archive" class="w-5 h-5"></i>
                    <span class="text-[8px] font-bold tracking-[0.1em]">档案</span>
                </a>
                <a href="#" class="flex flex-col items-center gap-1 text-tcm-ink/30 active:text-tcm-ink/60">
                    <i data-lucide="user" class="w-5 h-5"></i>
                    <span class="text-[8px] font-bold tracking-[0.1em]">我的</span>
                </a>
            </nav>
        </div>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>

</html>
