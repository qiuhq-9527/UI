<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muse AI - Oil Painting & Glass Interface</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Space+Grotesk:wght@300;400;500&display=swap"
        rel="stylesheet">

    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tcm: {
                            base: '#f4f1ea',      // 宣纸基底
                            ink: '#2c3e50',       // 墨色
                            teal: '#2d5a57',      // 黛绿
                            vermilion: '#a5433d', // 官窑红
                            ochre: '#c49a6c',     // 赭石
                            dim: 'rgba(44, 62, 80, 0.05)' // 极淡墨渍
                        }
                    },
                    fontFamily: {
                        serif: ['"Noto Serif SC"', 'serif'],
                        mono: ['"Space Grotesk"', 'monospace'],
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'breathe': 'breathe 4s ease-in-out infinite',
                        'enter': 'slideUp 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        breathe: {
                            '0%, 100%': { opacity: '0.6' },
                            '50%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* 全局重置 */
        body,
        html {
            background-color: #f4f1ea;
            /* 宣纸基底 */
            color: #2c3e50;
            /* 墨色 */
            overflow: hidden;
            /* 隐藏 Web 滚动条，追求 App 感 */
        }

        /* 1. 全局噪点 (Global Noise) */
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            opacity: 0.04;
            /* 微微可见 */
            filter: contrast(120%) brightness(100%);
        }

        /* 2. 油画玻璃态 (Oil Glass) - 核心质感 */
        .oil-glass {
            background: rgba(255, 255, 255, 0.35);
            /* 极低透明度，依赖模糊 */
            backdrop-filter: blur(24px) saturate(160%);
            /* 核心参数 */
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            /* 物理边缘 */
            box-shadow:
                inset 0 0 2px 1px rgba(255, 255, 255, 0.2),
                /* 内发光 */
                0 20px 40px -15px rgba(44, 62, 80, 0.05);
            /* 苹果式软阴影 */
        }

        /* 强调玻璃态 (Active/Hover) */
        .oil-glass-active {
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow:
                inset 0 0 2px 1px rgba(255, 255, 255, 0.4),
                0 25px 50px -12px rgba(44, 62, 80, 0.1);
        }

        /* 3. 触感反馈 (Tactile) */
        .btn-tactile {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-tactile:active {
            transform: scale(0.96);
            opacity: 0.85;
        }

        /* 滚动条隐藏但保留功能 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 水印字体 */
        .watermark {
            position: absolute;
            font-family: 'Noto Serif SC', serif;
            font-size: 12rem;
            color: #2c3e50;
            opacity: 0.02;
            pointer-events: none;
            z-index: 0;
            line-height: 1;
        }
    </style>
</head>

<body class="h-screen w-screen flex justify-center items-center relative selection:bg-tcm-ochre selection:text-white">

    <div id="app" class="w-full h-full max-w-[1400px] p-4 md:p-6 lg:p-8 flex flex-col relative z-10">

        <div
            class="fixed top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-tcm-teal blur-[120px] opacity-20 animate-float pointer-events-none">
        </div>
        <div class="fixed bottom-[-10%] right-[-10%] w-[60vw] h-[60vw] rounded-full bg-tcm-ochre blur-[140px] opacity-15 animate-float pointer-events-none"
            style="animation-delay: 2s;"></div>
        <div
            class="fixed top-[20%] right-[20%] w-[30vw] h-[30vw] rounded-full bg-tcm-vermilion blur-[100px] opacity-10 animate-breathe pointer-events-none">
        </div>

        <div class="watermark top-10 left-10">灵</div>
        <div class="watermark bottom-10 right-10">韵</div>

        <div class="grid grid-cols-1 md:grid-cols-12 grid-rows-12 gap-4 h-full">

            <div
                class="hidden md:flex col-span-3 row-span-12 oil-glass rounded-3xl p-6 flex-col justify-between relative overflow-hidden">
                <div>
                    <div class="flex items-center gap-2 mb-8">
                        <div class="w-1.5 h-1.5 rounded-full bg-tcm-vermilion"></div>
                        <h1 class="font-serif text-2xl font-black tracking-widest text-tcm-ink">墨 · 问</h1>
                    </div>

                    <div class="space-y-4">
                        <div class="p-4 rounded-xl bg-tcm-ink/5 border border-tcm-ink/5 backdrop-blur-sm">
                            <p class="font-mono text-xs text-tcm-teal uppercase tracking-wider mb-1">Status</p>
                            <div class="flex items-center gap-2">
                                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                                <span class="font-serif text-sm text-tcm-ink font-bold">在线 - 听雨模式</span>
                            </div>
                        </div>

                        <div
                            class="p-4 rounded-xl border border-tcm-ink/10 hover:bg-white/20 transition-colors cursor-pointer btn-tactile">
                            <div class="flex items-center justify-between mb-2">
                                <i class="ph ph-paint-brush-broad text-xl text-tcm-ochre"></i>
                                <span class="font-mono text-xs text-tcm-ink/40">01</span>
                            </div>
                            <h3 class="font-serif font-bold text-tcm-ink">美学设定</h3>
                            <p class="text-xs text-tcm-ink/60 mt-1 font-mono">Oil Painting & Glass</p>
                        </div>

                        <div
                            class="p-4 rounded-xl border border-tcm-ink/10 hover:bg-white/20 transition-colors cursor-pointer btn-tactile">
                            <div class="flex items-center justify-between mb-2">
                                <i class="ph ph-scroll text-xl text-tcm-teal"></i>
                                <span class="font-mono text-xs text-tcm-ink/40">02</span>
                            </div>
                            <h3 class="font-serif font-bold text-tcm-ink">历史记录</h3>
                            <p class="text-xs text-tcm-ink/60 mt-1 font-mono">The Past Conversations</p>
                        </div>
                    </div>
                </div>

                <div class="border-t border-tcm-ink/10 pt-4">
                    <p class="font-serif text-xs text-tcm-ink/50 text-center leading-relaxed">
                        数字与水墨的交响<br>
                        Designed for Deep Thought
                    </p>
                </div>
            </div>

            <div class="md:hidden col-span-1 row-span-1 oil-glass rounded-2xl flex items-center justify-between px-6">
                <span class="font-serif font-black text-lg text-tcm-ink">墨 · 问</span>
                <div class="w-8 h-8 rounded-full bg-tcm-ink/5 flex items-center justify-center">
                    <i class="ph ph-list text-tcm-ink"></i>
                </div>
            </div>

            <div
                class="col-span-1 md:col-span-9 row-span-11 md:row-span-10 oil-glass rounded-3xl relative flex flex-col overflow-hidden">

                <div class="flex-1 overflow-y-auto p-6 md:p-10 space-y-8 no-scrollbar scroll-smooth"
                    ref="chatContainer">

                    <div class="flex flex-col items-center justify-center py-10 opacity-60">
                        <i class="ph ph-flower-lotus text-4xl text-tcm-teal mb-4"></i>
                        <p class="font-serif text-tcm-ink text-sm tracking-widest">静候君问</p>
                    </div>

                    <div v-for="(msg, index) in messages" :key="index" class="flex w-full animate-enter"
                        :class="msg.role === 'user' ? 'justify-end' : 'justify-start'">

                        <div v-if="msg.role === 'ai'"
                            class="w-8 h-8 rounded-full bg-tcm-ink flex items-center justify-center mr-3 shrink-0 shadow-lg mt-1">
                            <span class="font-serif text-tcm-base text-xs">墨</span>
                        </div>

                        <div class="max-w-[85%] md:max-w-[70%] p-4 md:p-5 rounded-2xl border backdrop-blur-md shadow-sm transition-all duration-300"
                            :class="msg.role === 'user' 
                                ? 'bg-tcm-teal text-tcm-base border-transparent rounded-tr-sm apple-shadow' 
                                : 'bg-white/40 text-tcm-ink border-white/60 rounded-tl-sm hover:bg-white/50'">

                            <p class="text-sm md:text-base leading-relaxed whitespace-pre-line"
                                :class="msg.role === 'user' ? 'font-mono' : 'font-sans'">
                                {{ msg.content }}
                            </p>

                            <div class="mt-2 text-[10px] opacity-40 font-mono text-right tracking-wider">
                                {{ msg.time }}
                            </div>
                        </div>
                    </div>

                    <div v-if="isTyping" class="flex justify-start w-full animate-pulse">
                        <div
                            class="w-8 h-8 rounded-full bg-tcm-ink flex items-center justify-center mr-3 shrink-0 opacity-50">
                            <span class="font-serif text-tcm-base text-xs">墨</span>
                        </div>
                        <div
                            class="bg-white/30 px-4 py-3 rounded-2xl rounded-tl-sm flex items-center gap-1.5 border border-white/40">
                            <div class="w-1.5 h-1.5 bg-tcm-ink rounded-full animate-bounce"></div>
                            <div class="w-1.5 h-1.5 bg-tcm-ink rounded-full animate-bounce"
                                style="animation-delay: 0.1s"></div>
                            <div class="w-1.5 h-1.5 bg-tcm-ink rounded-full animate-bounce"
                                style="animation-delay: 0.2s"></div>
                        </div>
                    </div>

                    <div ref="bottomAnchor"></div>
                </div>
            </div>

            <div class="col-span-1 md:col-span-9 row-span-1 md:row-span-2 flex items-end pb-2">
                <div
                    class="w-full oil-glass-active rounded-2xl p-2 md:p-3 flex items-center gap-3 relative transition-all duration-300 focus-within:ring-1 focus-within:ring-tcm-ink/20 focus-within:scale-[1.01]">

                    <button
                        class="w-10 h-10 md:w-12 md:h-12 rounded-xl bg-tcm-ink/5 hover:bg-tcm-ink/10 flex items-center justify-center text-tcm-ink transition-colors btn-tactile shrink-0">
                        <i class="ph ph-plus text-lg"></i>
                    </button>

                    <input v-model="inputMessage" @keyup.enter="sendMessage" type="text" placeholder="请输入..."
                        class="flex-1 bg-transparent border-none outline-none text-tcm-ink placeholder-tcm-ink/30 font-mono text-sm md:text-base h-full px-2">

                    <button @click="sendMessage" :disabled="!inputMessage.trim() || isTyping"
                        class="w-10 h-10 md:w-12 md:h-12 rounded-xl bg-tcm-vermilion text-tcm-base flex items-center justify-center shadow-lg shadow-tcm-vermilion/20 hover:brightness-110 disabled:opacity-50 disabled:cursor-not-allowed btn-tactile shrink-0 transition-all">
                        <i class="ph ph-paper-plane-right-fill text-lg"></i>
                    </button>
                </div>
            </div>

        </div>
    </div>

    <svg class="noise-overlay">
        <filter id="noiseFilter">
            <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
        </filter>
        <rect width="100%" height="100%" filter="url(#noiseFilter)" />
    </svg>

    <script>
        const { createApp, ref, nextTick } = Vue;

        createApp({
            setup() {
                const inputMessage = ref('');
                const isTyping = ref(false);
                const chatContainer = ref(null);
                const bottomAnchor = ref(null);

                const messages = ref([
                    {
                        role: 'ai',
                        content: '这里是「墨问」。\n界面如宣纸铺陈，文字如墨迹流淌。\n请问，今日想探讨些什么？',
                        time: '10:00'
                    }
                ]);

                const scrollToBottom = async () => {
                    await nextTick();
                    bottomAnchor.value?.scrollIntoView({ behavior: 'smooth' });
                };

                const getCurrentTime = () => {
                    const now = new Date();
                    return `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
                };

                const sendMessage = async () => {
                    if (!inputMessage.value.trim() || isTyping.value) return;

                    // 1. User Message
                    const userText = inputMessage.value;
                    messages.value.push({
                        role: 'user',
                        content: userText,
                        time: getCurrentTime()
                    });

                    inputMessage.value = '';
                    scrollToBottom();
                    isTyping.value = true;

                    // 2. Simulate Network Delay (Mock AI)
                    setTimeout(() => {
                        let aiResponse = "";

                        // Simple Logic for demo
                        if (userText.includes("设计") || userText.includes("美")) {
                            aiResponse = "美学并非单纯的视觉堆砌，而是对「空」的处理。\n\n如同这界面，我们在 CSS 中使用了 `backdrop-filter: blur(24px)` 来模拟油画的厚重，又用 `#f4f1ea` 的宣纸色来保留呼吸感。\n\n这就是极客与文人的平衡。";
                        } else if (userText.includes("你好")) {
                            aiResponse = "君好。此刻风清气朗，正是编程赋诗的好时光。";
                        } else {
                            aiResponse = "这是一个非常有趣的角度。当我们剥离了繁杂的 UI 装饰，留下的便是信息最纯粹的骨架。\n\n(这是一个模拟的 AI 回复，展示长文本排版效果。)";
                        }

                        messages.value.push({
                            role: 'ai',
                            content: aiResponse,
                            time: getCurrentTime()
                        });

                        isTyping.value = false;
                        scrollToBottom();
                    }, 1500);
                };

                return {
                    messages,
                    inputMessage,
                    sendMessage,
                    isTyping,
                    chatContainer,
                    bottomAnchor
                };
            }
        }).mount('#app');
    </script>
</body>

</html>
