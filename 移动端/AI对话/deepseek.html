<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>墨影 · AI对话</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Inter:wght@300;400;500&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/lucide-icons"></script>
    <style>
        /* 全局重置与基础设置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            /* 宣纸与矿物色盘 */
            --tcm-base: #f4f1ea;
            --tcm-ink: #2c3e50;
            --tcm-teal: #2d5a57;
            --tcm-vermilion: #a5433d;
            --tcm-ochre: #c49a6c;
            --tcm-sky: #7a9eb1;

            /* 字体系统 */
            --font-serif: 'Noto Serif SC', serif;
            --font-sans: 'Inter', sans-serif;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--tcm-base);
            color: var(--tcm-ink);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
            position: relative;
        }

        /* 宣纸基底 - 叠加噪点纹理 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: -1;
        }

        /* 环境光晕 - 油画背景色块 */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 80%, rgba(125, 158, 177, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(196, 154, 108, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: -2;
        }

        /* 隐藏滚动条但保持可滚动 */
        .scroll-container {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .scroll-container::-webkit-scrollbar {
            display: none;
        }

        /* 油画玻璃质感核心类 */
        .oil-glass {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(25px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: inset 0 0 1px 1px rgba(255, 255, 255, 0.2),
                0 10px 30px -10px rgba(44, 62, 80, 0.08);
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        /* 磨砂玻璃变体 - 更深层 */
        .oil-glass-deep {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(35px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: inset 0 0 2px 1px rgba(255, 255, 255, 0.15),
                0 15px 40px -15px rgba(44, 62, 80, 0.12);
        }

        /* 苹果式软阴影 */
        .apple-shadow {
            box-shadow: 0 10px 30px -10px rgba(44, 62, 80, 0.08);
        }

        /* 衬线字体标题 */
        .serif-heading {
            font-family: var(--font-serif);
            font-weight: 900;
            letter-spacing: -0.02em;
        }

        /* 极细无衬线字体 */
        .sans-thin {
            font-family: var(--font-sans);
            font-weight: 300;
            letter-spacing: 0.02em;
        }

        /* 水印背景纹理 */
        .watermark-bg {
            position: absolute;
            font-family: var(--font-serif);
            font-weight: 900;
            font-size: 15rem;
            color: var(--tcm-ink);
            opacity: 0.03;
            pointer-events: none;
            z-index: -1;
            white-space: nowrap;
            overflow: hidden;
        }

        /* 微交互：触感反馈 */
        .tactile {
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        .tactile:active {
            transform: scale(0.98);
            opacity: 0.8;
        }

        /* 强调色圆点 */
        .accent-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: var(--tcm-vermilion);
            border-radius: 50%;
            margin-right: 8px;
            vertical-align: middle;
        }

        /* 渐变分割线 */
        .gradient-line {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(44, 62, 80, 0.15), transparent);
            margin: 1.5rem 0;
        }

        /* 数据跳动条 */
        .pulse-bar {
            height: 4px;
            width: 100%;
            background: linear-gradient(90deg, var(--tcm-teal), var(--tcm-sky));
            border-radius: 2px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.7;
            }

            50% {
                opacity: 1;
            }
        }

        /* 主容器 */
        .app-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem;
            min-height: 100vh;
            position: relative;
        }

        /* Bento网格布局 */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: auto auto;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            .bento-grid {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: repeat(3, auto);
            }

            .watermark-bg {
                font-size: 8rem;
            }
        }

        /* 对话区域 */
        .chat-container {
            height: 60vh;
            overflow-y: auto;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        /* 消息气泡 */
        .message-bubble {
            max-width: 85%;
            padding: 1rem 1.25rem;
            margin-bottom: 1.25rem;
            position: relative;
            line-height: 1.7;
        }

        .user-message {
            margin-left: auto;
            background: rgba(45, 90, 87, 0.08);
            border-left: 3px solid var(--tcm-teal);
            border-radius: 18px 18px 4px 18px;
        }

        .ai-message {
            margin-right: auto;
            background: rgba(255, 255, 255, 0.65);
            border-left: 3px solid var(--tcm-ochre);
            border-radius: 18px 18px 18px 4px;
        }

        /* 输入区域 */
        .input-container {
            display: flex;
            gap: 0.75rem;
            align-items: flex-end;
        }

        .input-field {
            flex: 1;
            padding: 1.25rem;
            font-family: var(--font-sans);
            font-size: 1rem;
            border: none;
            resize: none;
            min-height: 60px;
            max-height: 120px;
            line-height: 1.6;
        }

        .input-field:focus {
            outline: none;
        }

        /* 发送按钮 */
        .send-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* 图标容器 - 低对比度 */
        .icon-container {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(165, 67, 61, 0.05);
        }

        /* 加载动画 */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 1rem;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background-color: var(--tcm-ochre);
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out both;
        }

        .typing-dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .typing-dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes typing {

            0%,
            80%,
            100% {
                transform: scale(0.6);
                opacity: 0.5;
            }

            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* 状态指示器 */
        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .status-online {
            background-color: rgba(45, 90, 87, 0.2);
            color: var(--tcm-teal);
        }

        .status-online .status-dot {
            background-color: var(--tcm-teal);
            animation: pulse 2s infinite;
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="app-container">
            <!-- 背景水印 -->
            <div class="watermark-bg" style="top: 10%; left: 5%;">墨</div>
            <div class="watermark-bg" style="bottom: 10%; right: 5%;">影</div>

            <!-- Bento网格布局 -->
            <div class="bento-grid">
                <!-- 视觉重心：纵向长卡片 -->
                <div class="oil-glass-deep row-span-2 p-6" style="grid-column: span 2; grid-row: span 2;">
                    <div class="flex items-start mb-4">
                        <span class="accent-dot"></span>
                        <h2 class="serif-heading text-2xl">墨影 · AI</h2>
                    </div>
                    <p class="sans-thin mb-6 opacity-80">融合东方美学与前沿技术的对话体验。在宣纸的温润与玻璃的通透间，感受思想的流动。</p>

                    <div class="gradient-line"></div>

                    <div class="mb-6">
                        <h3 class="serif-heading text-lg mb-3">对话状态</h3>
                        <div class="status-indicator status-online">
                            <div class="status-dot"></div>
                            <span>在线 · 思考中</span>
                        </div>
                    </div>

                    <div class="pulse-bar mb-6"></div>

                    <div>
                        <h3 class="serif-heading text-lg mb-3">今日对话</h3>
                        <p class="sans-thin text-sm opacity-70">已进行 {{ messageCount }} 次交流 · 探索 {{ topicCount }} 个主题</p>
                    </div>
                </div>

                <!-- 辅助信息卡片 -->
                <div class="oil-glass p-5">
                    <div class="icon-container mb-3">
                        <i data-lucide="sparkles" width="24" height="24" stroke-width="1.5"></i>
                    </div>
                    <h3 class="serif-heading text-lg mb-2">创造力</h3>
                    <p class="sans-thin text-sm opacity-80">激发灵感，探索未知</p>
                </div>

                <div class="oil-glass p-5">
                    <div class="icon-container mb-3">
                        <i data-lucide="brain" width="24" height="24" stroke-width="1.5"></i>
                    </div>
                    <h3 class="serif-heading text-lg mb-2">深度思考</h3>
                    <p class="sans-thin text-sm opacity-80">逻辑严谨，层层递进</p>
                </div>

                <!-- 节奏阻断：横向长条 -->
                <div class="oil-glass col-span-2 p-4 mt-3 flex items-center justify-between">
                    <div class="flex items-center">
                        <div class="icon-container mr-3">
                            <i data-lucide="message-circle" width="20" height="20" stroke-width="1.5"></i>
                        </div>
                        <div>
                            <h3 class="serif-heading text-lg">对话进行中</h3>
                            <p class="sans-thin text-sm opacity-80">与墨影AI的深度交流</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="sans-thin text-sm opacity-70">响应时间</p>
                        <p class="serif-heading">{{ responseTime }}ms</p>
                    </div>
                </div>
            </div>

            <!-- 对话区域 -->
            <div class="oil-glass chat-container scroll-container">
                <div v-for="(message, index) in messages" :key="index"
                    :class="['message-bubble', message.sender === 'user' ? 'user-message' : 'ai-message']">
                    <div v-if="message.sender === 'ai'" class="flex items-start mb-2">
                        <div class="icon-container mr-3" style="width: 36px; height: 36px;">
                            <i data-lucide="bot" width="16" height="16" stroke-width="1.5"></i>
                        </div>
                        <span class="serif-heading text-sm">墨影AI</span>
                    </div>

                    <div v-if="message.sender === 'user'" class="flex items-start mb-2 justify-end">
                        <span class="serif-heading text-sm mr-3">您</span>
                        <div class="icon-container" style="width: 36px; height: 36px;">
                            <i data-lucide="user" width="16" height="16" stroke-width="1.5"></i>
                        </div>
                    </div>

                    <div class="message-content">
                        <p class="sans-thin">{{ message.text }}</p>
                    </div>

                    <div class="text-xs opacity-60 mt-2" :class="{'text-right': message.sender === 'user'}">
                        {{ message.time }}
                    </div>
                </div>

                <!-- 输入时显示加载动画 -->
                <div v-if="isTyping" class="message-bubble ai-message">
                    <div class="flex items-start mb-2">
                        <div class="icon-container mr-3" style="width: 36px; height: 36px;">
                            <i data-lucide="bot" width="16" height="16" stroke-width="1.5"></i>
                        </div>
                        <span class="serif-heading text-sm">墨影AI</span>
                    </div>
                    <div class="typing-indicator">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>
            </div>

            <!-- 输入区域 -->
            <div class="oil-glass input-container p-4">
                <textarea v-model="userInput" @keydown.enter.exact.prevent="sendMessage"
                    class="input-field oil-glass scroll-container sans-thin"
                    placeholder="输入您的思考...（Enter发送，Shift+Enter换行）" rows="1" @input="autoResize"></textarea>

                <button @click="sendMessage" :disabled="!userInput.trim() || isTyping"
                    class="send-btn oil-glass-deep tactile"
                    :style="{backgroundColor: userInput.trim() ? 'var(--tcm-vermilion)' : 'rgba(165, 67, 61, 0.2)', color: userInput.trim() ? 'white' : 'rgba(165, 67, 61, 0.5)'}">
                    <i data-lucide="send" width="20" height="20" stroke-width="1.5"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted, nextTick } = Vue;

        createApp({
            setup() {
                // 响应式数据
                const messages = ref([
                    { sender: 'ai', text: '您好，我是墨影AI。在宣纸的温润与玻璃的通透间，我将与您展开对话。请问今天想探讨什么主题？', time: '10:00' },
                    { sender: 'user', text: '请为我解释一下东方美学中的"留白"概念。', time: '10:02' },
                    { sender: 'ai', text: '"留白"是东方艺术的重要美学原则，指在创作中 intentionally 保留空白区域，以无形的空间衬托有形的主体。它不仅是视觉上的呼吸感，更是哲学上的"虚空生妙有"，为观者预留想象与思考的空间。', time: '10:03' },
                ]);

                const userInput = ref('');
                const isTyping = ref(false);
                const messageCount = ref(3);
                const topicCount = ref(1);
                const responseTime = ref(420);

                // AI响应库
                const aiResponses = [
                    "从美学角度看，这让我联想到宋代山水画中的烟云处理——以虚无衬托实有，形成深远的空间感。",
                    "在数字界面设计中，留白原则同样适用。适当的负空间能提升可读性，引导用户视线，创造优雅的视觉层次。",
                    "您是否注意到，这个界面本身也运用了留白理念？卡片间的间隙、文字周围的呼吸空间，都是现代设计中对传统美学的致敬。",
                    "日本设计中的'侘寂'美学与留白有异曲同工之妙，都强调不完美、不完整中的美学价值。",
                    "西方极简主义与东方留白的区别在于，前者追求功能性削减，后者注重哲学性虚空。两者在视觉上相似，但文化内核不同。",
                    "在诗歌中，留白体现在'言有尽而意无穷'。王维的'空山不见人，但闻人语响'便是以有声衬无声的经典。",
                    "您对留白在当代数字艺术中的应用有什么具体想探讨的方向吗？",
                ];

                // 发送消息
                const sendMessage = async () => {
                    const text = userInput.value.trim();
                    if (!text || isTyping.value) return;

                    // 添加用户消息
                    const now = new Date();
                    const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

                    messages.value.push({
                        sender: 'user',
                        text: text,
                        time: timeStr
                    });

                    messageCount.value++;
                    topicCount.value = Math.floor(messageCount.value / 3) + 1;
                    userInput.value = '';

                    // 重置文本框高度
                    const textarea = document.querySelector('.input-field');
                    textarea.style.height = 'auto';

                    // 滚动到底部
                    await nextTick();
                    scrollToBottom();

                    // 模拟AI思考
                    isTyping.value = true;
                    responseTime.value = Math.floor(Math.random() * 200) + 300;

                    // 模拟AI响应延迟
                    setTimeout(() => {
                        const aiResponse = aiResponses[Math.floor(Math.random() * aiResponses.length)];
                        const aiTime = new Date();
                        const aiTimeStr = `${aiTime.getHours().toString().padStart(2, '0')}:${aiTime.getMinutes().toString().padStart(2, '0')}`;

                        messages.value.push({
                            sender: 'ai',
                            text: aiResponse,
                            time: aiTimeStr
                        });

                        isTyping.value = false;
                        messageCount.value++;

                        // 滚动到底部
                        scrollToBottom();
                    }, 1500);
                };

                // 自动调整文本框高度
                const autoResize = (event) => {
                    const textarea = event.target;
                    textarea.style.height = 'auto';
                    textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
                };

                // 滚动到底部
                const scrollToBottom = () => {
                    const chatContainer = document.querySelector('.chat-container');
                    if (chatContainer) {
                        chatContainer.scrollTop = chatContainer.scrollHeight;
                    }
                };

                // 初始化Lucide图标
                onMounted(() => {
                    lucide.createIcons();
                    scrollToBottom();
                });

                return {
                    messages,
                    userInput,
                    isTyping,
                    messageCount,
                    topicCount,
                    responseTime,
                    sendMessage,
                    autoResize
                };
            }
        }).mount('#app');
    </script>
</body>

</html>
