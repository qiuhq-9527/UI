<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d7d9c1">
  <meta name="description" content="纯 TypeScript 实现的极简编码 Agent，学习用尽可能少的代码做出类似 Pi 的 Agent。">
  <title>TinyCodingAgent — 纯 TypeScript 极简编码 Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="m-0 bg-[#d7d9c1] font-[DM_Sans,sans-serif] text-[#26322b] antialiased">
  <div id="app">
    <main class="relative isolate min-h-screen">
      <img class="fixed inset-0 -z-20 h-full w-full object-cover object-center" src="./assets/bg.webp" alt="">
      <div class="fixed inset-0 -z-10 bg-gradient-to-b from-[#edf0df]/25 via-[#e3e3d0]/5 to-[#18221c]/15"></div>

      <a class="fixed right-5 top-5 z-10 grid size-10 place-items-center text-[#26322b] transition-colors hover:text-[#92794b] sm:right-8 sm:top-7" href="https://github.com/qiuhq-9527/TinyCodingAgent" target="_blank" rel="noreferrer" aria-label="在 GitHub 查看 TinyCodingAgent">
        <svg class="size-8" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10.226 17.284c-2.965-.36-5.054-2.493-5.054-5.256 0-1.123.404-2.336 1.078-3.144-.292-.741-.247-2.314.09-2.965.898-.112 2.111.36 2.83 1.01.853-.269 1.752-.404 2.853-.404 1.1 0 1.999.135 2.807.382.696-.629 1.932-1.1 2.83-.988.315.606.36 2.179.067 2.942.72.854 1.101 2 1.101 3.167 0 2.763-2.089 4.852-5.098 5.234.763.494 1.28 1.572 1.28 2.807v2.336c0 .674.561 1.056 1.235.786 4.066-1.55 7.255-5.615 7.255-10.646C23.5 6.188 18.334 1 11.978 1 5.62 1 .5 6.188.5 12.545c0 4.986 3.167 9.12 7.435 10.669.606.225 1.19-.18 1.19-.786V20.63a2.9 2.9 0 0 1-1.078.224c-1.483 0-2.359-.808-2.987-2.313-.247-.607-.517-.966-1.034-1.033-.27-.023-.359-.135-.359-.27 0-.27.45-.471.898-.471.652 0 1.213.404 1.797 1.235.45.651.921.943 1.483.943.561 0 .92-.202 1.437-.719.382-.381.674-.718.944-.943"></path></svg>
      </a>

      <section class="mx-auto flex w-full max-w-7xl flex-col items-center px-6 pb-10 pt-20 text-center sm:px-10 sm:pb-12 sm:pt-24 lg:px-16 lg:pt-28">
        <h1 class="font-['Noto_Serif_SC',serif] text-[clamp(1.75rem,4vw,3rem)] font-medium leading-[1.3] tracking-[.04em] text-[#26322b]">零依赖 纯TS实现的极简编码Agent</h1>
        <p class="mt-3 max-w-2xl font-['Noto_Serif_SC',serif] text-sm leading-7 tracking-[.04em] text-[#26322b]/85 sm:mt-4 sm:text-base">
          学习项目 尝试用尽可能少的代码做出一个类似<a class="underline decoration-[#92794b]/60 underline-offset-4 transition-colors hover:text-[#92794b]" href="https://pi.dev/" target="_blank" rel="noreferrer">PI</a>的Agent
        </p>

        <div class="mt-5 flex items-center gap-2.5 sm:mt-6">
          <div class="group relative">
            <div class="pointer-events-none absolute bottom-full left-1/2 z-10 mb-3 w-[min(25rem,calc(100vw-3rem))] -translate-x-1/2 translate-y-2 rounded-lg border border-[#26322b]/15 bg-[#f4f0e4]/95 p-3 text-left opacity-0 shadow-[0_12px_36px_rgba(23,31,25,0.2)] backdrop-blur-md transition duration-200 group-hover:pointer-events-auto group-hover:translate-y-0 group-hover:opacity-100 group-focus-within:pointer-events-auto group-focus-within:translate-y-0 group-focus-within:opacity-100">
              <div class="flex items-center justify-between gap-3">
                <code class="min-w-0 break-all font-mono text-xs leading-5 text-[#26322b]">{{ command }}</code>
                <svg v-if="copied" class="size-4 shrink-0 text-[#4c8a5b]" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m4 10 4 4 8-8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </div>
            </div>
            <button class="inline-flex h-10 w-24 items-center justify-center rounded-full border border-[#26322b]/70 bg-[#26322b] px-5 font-['Noto_Serif_SC',serif] text-xs tracking-[.08em] text-[#f4f0e4] shadow-[0_6px_18px_rgba(31,43,34,0.14)] transition-colors hover:bg-[#39463c]" type="button" @click="copyCommand">{{ copied ? '已复制' : '试试效果' }}</button>
          </div>
        </div>

        <div class="mt-10 w-[90%] max-w-5xl sm:mt-12">
          <img class="block h-auto w-full" src="./assets/demo.webp" alt="TinyCodingAgent 终端编码助手界面">
          <p class="mt-3 text-center font-['Noto_Serif_SC',serif] text-xs tracking-[.04em] text-[#f4f0e4]/90 sm:text-sm">画面中的终端为 Otty，<a class="underline decoration-[#f4f0e4]/60 underline-offset-4 transition-colors hover:text-white" href="https://otty.sh/" target="_blank" rel="noreferrer">了解更多</a></p>
        </div>
      </section>
    </main>
  </div>

  <script>
    const { createApp, ref } = Vue;

    createApp({
      setup() {
        const command = 'npm install -g @tinycodingagent/coding-agent';
        const copied = ref(false);

        const copyCommand = async () => {
          await navigator.clipboard.writeText(command);
          copied.value = true;
        };

        return { command, copied, copyCommand };
      }
    }).mount('#app');
  </script>
</body>
</html>
